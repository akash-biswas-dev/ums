services:
  mysql:
    container_name: ums-db-dev
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_USER=dev
      - MYSQL_PASSWORD=password
      - MYSQL_DATABASE=ums-db-dev
  redis:
    container_name: ums-session-storage
    image: redis:8.4.0-bookworm
    ports:
      - "6379:6379"